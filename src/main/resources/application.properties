spring.application.name=quote-journal
server.port=${PORT:8080}

# --- Database Configuration ---
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.datasource.url=jdbc:h2:mem:quotebook
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create
# This tells Spring Boot 3 to run data.sql AFTER Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true

# --- SQL Initialization ---
spring.sql.init.mode=always
# Explicitly point to the file just in case
spring.sql.init.data-locations=classpath:data.sql

# --- Render/Performance Optimization ---
spring.main.banner-mode=off
server.tomcat.threads.max=2

# --- Security ---
app.jwt.secret=${JWT_SECRET:yourDefaultSuperSecretKeyForLocalDevelopmentOnly1234567890}
app.jwt.expiration=86400000
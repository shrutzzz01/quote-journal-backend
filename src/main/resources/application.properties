spring.application.name=quote-journal
server.port=${PORT:8080}
# Database Configuration
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:quotebook
# Use environment variables for sensitive info, with defaults for local dev
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.validation-timeout=2000
# JPA/Hibernate
# 'update' is safer for deployment than 'create-drop'
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Security (Crucial for Render)
# This will look for an environment variable on Render, or use the long string locally
app.jwt.secret=${JWT_SECRET:yourDefaultSuperSecretKeyForLocalDevelopmentOnly1234567890}
app.jwt.expiration=86400000